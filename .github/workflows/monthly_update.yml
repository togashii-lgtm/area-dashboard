name: Monthly e-Stat Data Update

on:
  schedule:
    # 毎月5日 午前9時 (JST) = UTC 0:00 に定期実行
    - cron: '0 0 5 * *'
  workflow_dispatch: # 手動実行トリガー

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch latest data from e-Stat
        env:
          ESTAT_API_KEY: ${{ secrets.ESTAT_API_KEY }}
        run: |
          python scripts/fetch_data.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          if git diff --staged --quiet; then
            echo "No changes in data"
          else
            git commit -m "Auto-update e-Stat data [$(date +'%Y-%m-%d')]"
            git push
          fi
